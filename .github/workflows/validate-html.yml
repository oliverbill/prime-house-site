name: Validar site

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  cname:
    name: Conferir CNAME
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Conferir que o CNAME nao foi removido ou alterado
        run: |
          if [ ! -f CNAME ]; then
            echo "::error::Arquivo CNAME nao encontrado. O dominio customizado do GitHub Pages pode quebrar."
            exit 1
          fi
          if [ "$(cat CNAME)" != "primehouse.srv.br" ]; then
            echo "::error::CNAME contem valor inesperado: $(cat CNAME)"
            exit 1
          fi

  html:
    name: Validar HTML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validar HTML
        uses: anishathalye/proof-html@v2
        with:
          directory: .
          check_html: true
          check_favicon: false
          check_css: false
          ignore_empty_alt: true
          ignore_url: "https://www.instagram.com/primehouseassessoria"
          swap_urls: ""

  allowlist:
    name: Arquivos permitidos
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Conferir que o PR so altera arquivos da lista permitida
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          arquivos=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --paginate --jq '.[].filename')
          status=0
          for f in $arquivos; do
            case "$f" in
              CNAME)
                echo "::error::O CNAME controla o dominio do site e nao pode ser alterado por PR."
                status=1
                ;;
              index.html|style.css|robots.txt|sitemap.xml|assets/*)
                ;;
              *)
                echo "::error::Arquivo fora da lista permitida para edicao via PR: $f"
                status=1
                ;;
            esac
          done
          exit $status

  pedir-correcao:
    name: Pedir correcao ao Codex
    if: failure() && github.event_name == 'pull_request'
    needs: [cname, html, allowlist]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Comentar no PR pedindo que o Codex corrija (max 3 tentativas)
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          tentativas=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq '[.[] | select(.body | contains("@codex") and contains("validacao falhou"))] | length')
          if [ "$tentativas" -ge 3 ]; then
            gh pr comment "$PR" --repo "$REPO" --body "A validacao falhou 3 vezes seguidas neste PR. Parando as tentativas automaticas de correcao."
            exit 0
          fi
          gh pr comment "$PR" --repo "$REPO" --body "@codex a validacao falhou neste PR. Veja os erros apontados pelos checks em $RUN_URL e corrija, atualizando este mesmo PR ate todos os checks passarem. Lembretes: o CNAME nao pode ser alterado, e somente index.html, style.css, robots.txt, sitemap.xml e assets/ podem ser editados."
