name: Testes de links e menus

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  links:
    name: Clicar em todos os links e menus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        run: npm ci

      - name: Instalar navegadores do Playwright
        run: npx playwright install --with-deps chromium

      - name: Rodar testes de regressão (links e menus)
        run: npm test
